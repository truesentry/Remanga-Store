{% extends 'base.html' %}

{% block title %}Профіль — RemangaStore{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="auth-card">
                <div class="text-center mb-4">
                    <div class="profile-avatar mb-3">
                        <i class="bi bi-person-circle" style="font-size: 64px; color: #1976D2;"></i>
                    </div>
                    <h3 class="fw-bold">{{ request.user.username }}</h3>
                    {% if request.user.email %}
                    <p class="text-muted small">{{ request.user.email }}</p>
                    {% endif %}
                    <span class="badge bg-success">✓ Авторизований</span>
                </div>

                <div class="list-group list-group-flush mb-4">
                    <a href="{% url 'products' %}" class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
                        <i class="bi bi-bag text-primary fs-5"></i>
                        <span>Мої замовлення</span>
                        <i class="bi bi-chevron-right ms-auto text-muted"></i>
                    </a>
                    <a href="{% url 'create' %}" class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
                        <i class="bi bi-plus-circle text-primary fs-5"></i>
                        <span>Додати товар</span>
                        <i class="bi bi-chevron-right ms-auto text-muted"></i>
                    </a>
                </div>

                <a href="{% url 'logout' %}" class="btn btn-outline-danger w-100">
                    <i class="bi bi-box-arrow-right me-2"></i>Вийти
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
